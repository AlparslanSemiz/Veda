name: Bug report
description: Something in Veda doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. …
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. macOS 26.3
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model
      placeholder: e.g. MacBook Pro 13" M1, 2020
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options: [Homebrew, install.sh, built from source]
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Last lines of ~/Library/Logs/veda.log (or the Homebrew log under $(brew --prefix)/var/log), if any.
      render: text
